<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ส่งภาพขึ้นจอ!</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #121212; color: #ffffff; font-family: 'Prompt', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-image: radial-gradient(circle at top right, #1a2a3a 0%, #121212 50%); }
        .container { background: #1e1e1e; width: 90%; max-width: 400px; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); box-sizing: border-box; text-align: center; border: 1px solid #333; }
        .header-title { font-size: 24px; font-weight: 700; margin-bottom: 5px; background: linear-gradient(135deg, #00bcd4, #2196F3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-subtitle { font-size: 13px; color: #888; margin-bottom: 25px; }
        .upload-area { width: 100%; height: 250px; background-color: #252525; border: 2px dashed #444; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; margin-bottom: 20px; }
        .upload-area:hover, .upload-area:active { border-color: #00bcd4; background-color: #2a2a2a; }
        .upload-icon { font-size: 40px; margin-bottom: 10px; color: #666; }
        .upload-text { font-size: 14px; color: #aaa; font-weight: 600; }
        #imagePreview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: none; z-index: 2; }
        #removeImgBtn { position: absolute; top: 10px; right: 10px; background: rgba(244, 67, 54, 0.9); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 16px; font-weight: bold; cursor: pointer; display: none; z-index: 3; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .input-group { text-align: left; margin-bottom: 25px; }
        .input-label { font-size: 13px; font-weight: 600; color: #aaa; margin-bottom: 8px; display: block; }
        .text-input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #444; background: #252525; color: white; font-size: 16px; font-family: 'Prompt', sans-serif; box-sizing: border-box; transition: 0.3s; }
        .text-input:focus { border-color: #00bcd4; outline: none; box-shadow: 0 0 10px rgba(0, 188, 212, 0.2); }
        .text-limit { font-size: 11px; color: #666; text-align: right; margin-top: 5px; }
        .submit-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, #00bcd4, #2196F3); color: white; font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: 0 5px 15px rgba(0, 188, 212, 0.4); transition: 0.2s; font-family: 'Prompt', sans-serif; }
        .submit-btn:active { transform: scale(0.96); }
        #overlay-loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid #00bcd4; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-title">✨ แชร์โมเมนต์ของคุณ</div>
        <div class="header-subtitle">รูปภาพจะถูกส่งขึ้นจอบนเวทีทันที!</div>
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()" id="uploadBox">
            <div class="upload-icon">📸</div>
            <div class="upload-text">แตะเพื่อเลือกรูปภาพ</div>
            <img id="imagePreview" src="">
            <button id="removeImgBtn" onclick="removeImage(event)">×</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewFile(event)">
        
        <div class="input-group">
            <span class="input-label">ข้อความสั้นๆ (อธิบายรูปนี้)</span>
            <input type="text" id="messageInput" class="text-input" placeholder="พิมพ์ข้อความที่นี่..." maxlength="40" oninput="updateCharCount()">
            <div class="text-limit" id="charCount">0 / 40</div>
        </div>
        
        <button class="submit-btn" id="sendBtn" onclick="submitData()">🚀 ส่งขึ้นจอเลย!</button>
    </div>

    <div id="overlay-loading">
        <div class="spinner"></div>
        <div style="font-weight: bold; font-size: 18px; color: #00bcd4;" id="loadingText">กำลังส่งข้อมูล...</div>
    </div>

    <script>
        // 🌟 ใส่ URL ที่คุณสร้างมา
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1V8OqpPp3PuMXDf6nhtLd3ED8NT3pb1-O8bMTS38IoHKK5MgrqPvPXa2MZFVl9XYu3A/exec";

        function previewFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagePreview').src = e.target.result;
                document.getElementById('imagePreview').style.display = 'block';
                document.getElementById('removeImgBtn').style.display = 'block';
            }
            reader.readAsDataURL(file);
        }

        function removeImage(event) {
            event.stopPropagation();
            document.getElementById('fileInput').value = '';
            document.getElementById('imagePreview').src = '';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('removeImgBtn').style.display = 'none';
        }

        function updateCharCount() {
            document.getElementById('charCount').innerText = document.getElementById('messageInput').value.length + " / 40";
        }

        // ฟังก์ชันบีบอัดภาพก่อนส่ง เพื่อไม่ให้เกินลิมิต Google และส่งไวขึ้น
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 800; // บีบความละเอียดลงเหลือ 800px 
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                        else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8)); // ใช้ JPEG คุณภาพ 80% ให้เบาที่สุด
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function submitData() {
            const fileInput = document.getElementById('fileInput');
            const message = document.getElementById('messageInput').value.trim();

            if (!fileInput.files.length && message === "") {
                alert("กรุณาเลือกรูปภาพหรือพิมพ์ข้อความอย่างน้อย 1 อย่างครับ");
                return;
            }

            const loader = document.getElementById('overlay-loading');
            const loadingText = document.getElementById('loadingText');
            loader.style.display = 'flex';
            document.querySelector('.spinner').style.display = 'block';
            loadingText.innerText = "กำลังส่งข้อมูล...";
            loadingText.style.color = "#00bcd4";

            try {
                let base64Image = "";
                if (fileInput.files.length > 0) {
                    base64Image = await compressImage(fileInput.files[0]);
                }

                // เตรียมข้อมูลยิงเข้า Google
                const payload = JSON.stringify({ image: base64Image, text: message });

                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    // ใช้ text/plain เพื่อหลบข้อจำกัดเรื่อง CORS ของ Google (สูตรลับ!)
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: payload
                });

                document.querySelector('.spinner').style.display = 'none';
                loadingText.innerText = "✅ ส่งขึ้นจอเรียบร้อย!";
                loadingText.style.color = "#4CAF50";

                setTimeout(() => {
                    loader.style.display = 'none';
                    removeImage(new Event('click'));
                    document.getElementById('messageInput').value = '';
                    updateCharCount();
                }, 2000);

            } catch (error) {
                document.querySelector('.spinner').style.display = 'none';
                loadingText.innerText = "❌ เกิดข้อผิดพลาด กรุณาลองใหม่";
                loadingText.style.color = "#f44336";
                setTimeout(() => { loader.style.display = 'none'; }, 2000);
            }
        }
    </script>
</body>
</html>
