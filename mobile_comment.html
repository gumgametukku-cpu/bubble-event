<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ส่งความคิดเห็น</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #121212; color: #ffffff; font-family: 'Prompt', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background-image: radial-gradient(circle at top right, #1a2a3a 0%, #121212 50%); }
        .container { background: #1e1e1e; width: 90%; max-width: 400px; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 1px solid #333; text-align: center; }
        .header-title { font-size: 24px; font-weight: 700; margin-bottom: 5px; background: linear-gradient(135deg, #00bcd4, #2196F3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-subtitle { font-size: 13px; color: #888; margin-bottom: 25px; }
        
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-label { font-size: 14px; font-weight: 600; color: #00bcd4; margin-bottom: 8px; display: block; }
        .text-input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #444; background: #252525; color: white; font-size: 16px; font-family: 'Prompt', sans-serif; box-sizing: border-box; transition: 0.3s; }
        .text-input:focus { border-color: #00bcd4; outline: none; box-shadow: 0 0 10px rgba(0, 188, 212, 0.2); }
        textarea.text-input { resize: none; height: 120px; }
        
        .submit-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, #00bcd4, #2196F3); color: white; font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: 0 5px 15px rgba(0, 188, 212, 0.4); transition: 0.2s; font-family: 'Prompt', sans-serif; }
        .submit-btn:active { transform: scale(0.96); }

        #overlay-loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid #00bcd4; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-title">💬 ส่งความคิดเห็น</div>
        <div class="header-subtitle">ข้อความของคุณจะไปแสดงบนหน้าจอเวที</div>
        
        <div class="input-group">
            <span class="input-label">ชื่อของคุณ / นามแฝง</span>
            <input type="text" id="nameInput" class="text-input" placeholder="พิมพ์ชื่อที่นี่..." maxlength="30">
        </div>

        <div class="input-group">
            <span class="input-label">ความคิดเห็น</span>
            <!-- 🌟 ขยายให้พิมพ์ข้อความได้ยาวขึ้นเป็น 300 ตัวอักษร -->
            <textarea id="commentInput" class="text-input" placeholder="พิมพ์ความคิดเห็นของคุณ..." maxlength="300"></textarea>
        </div>
        
        <button class="submit-btn" onclick="submitData()">🚀 ส่งข้อความ</button>
    </div>

    <div id="overlay-loading">
        <div class="spinner"></div>
        <div style="font-weight: bold; font-size: 18px; color: #00bcd4;" id="loadingText">กำลังส่งข้อมูล...</div>
    </div>

    <script>
        // 🌟 ใส่ URL ของคุณ
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1V8OqpPp3PuMXDf6nhtLd3ED8NT3pb1-O8bMTS38IoHKK5MgrqPvPXa2MZFVl9XYu3A/exec"; 

        async function submitData() {
            const name = document.getElementById('nameInput').value.trim();
            const comment = document.getElementById('commentInput').value.trim();
            
            if (name === "" || comment === "") return alert("กรุณากรอกชื่อและความคิดเห็นให้ครบถ้วนครับ");
            
            const loader = document.getElementById('overlay-loading'); 
            const loadingText = document.getElementById('loadingText');
            loader.style.display = 'flex'; 
            document.querySelector('.spinner').style.display = 'block'; 
            loadingText.innerText = "กำลังส่งข้อมูล..."; 
            loadingText.style.color = "#00bcd4";

            try {
                const res = await fetch(GOOGLE_SCRIPT_URL, { 
                    method: 'POST', 
                    headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                    body: JSON.stringify({ type: "comment", name: name, text: comment }) 
                });
                
                document.querySelector('.spinner').style.display = 'none'; 
                loadingText.innerText = "✅ ส่งข้อความสำเร็จ!"; 
                loadingText.style.color = "#4CAF50";
                
                setTimeout(() => { 
                    loader.style.display = 'none'; 
                    document.getElementById('commentInput').value = ''; 
                }, 2000);
            } catch (error) {
                document.querySelector('.spinner').style.display = 'none'; 
                loadingText.innerText = "❌ เกิดข้อผิดพลาด"; 
                loadingText.style.color = "#f44336";
                setTimeout(() => { loader.style.display = 'none'; }, 2000);
            }
        }
    </script>
</body>
</html>
